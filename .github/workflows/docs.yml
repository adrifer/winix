name: Docs

# Builds the documentation site (site/, from docs/) and checks its links on
# every change. A stable release tag, or a manual run, also deploys it to
# GitHub Pages, so the site documents the version people install.

on:
  pull_request:
    paths: ["docs/**", "site/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "site/**", ".github/workflows/docs.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stable tags (v1.2.3) and manual runs deploy; previews (v1.2.3-preview.1) only build.
  DEPLOY: ${{ github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ env.DEPLOY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Build and check links
        run: npm run build
        working-directory: site
        env:
          # Links to files outside docs/ point at the deployed tag.
          WINIX_DOCS_REF: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
