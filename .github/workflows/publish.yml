name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: npm ci
      - name: Build standalone release executables
        run: WINIX_BUILD_VERSION="${GITHUB_REF_NAME#v}" npm run build:standalone
      - name: Include upstream runtime license information
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://raw.githubusercontent.com/oven-sh/bun/bun-v1.4.0/LICENSE.md \
            --output artifacts/BUN-LICENSE.md
          (cd artifacts && sha256sum BUN-LICENSE.md >> SHA256SUMS)
      - name: Smoke-test Linux executable
        run: npm test -- --run tests/standalone.test.ts
        env:
          WINIX_STANDALONE_TEST_BINARY: ${{ github.workspace }}/artifacts/winix-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: |
            artifacts/winix-*
            artifacts/SHA256SUMS
            artifacts/LICENSE
            artifacts/NOTICE.txt
            artifacts/BUN-LICENSE.md
          compression-level: 0

  standalone-windows:
    needs: standalone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: standalone
          path: artifacts
      - run: npm ci
      - name: Smoke-test Windows executable
        run: npm test -- --run tests/standalone.test.ts
        env:
          WINIX_STANDALONE_TEST_BINARY: ${{ github.workspace }}\artifacts\winix-windows-x64.exe

  publish:
    needs: [standalone, standalone-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ "$version" == *-preview.* ]]; then
            npm_tag="preview"
            prerelease="true"
            npm version "$version" --no-git-tag-version --allow-same-version
          else
            npm_tag="latest"
            prerelease="false"
            package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

            if [[ "$package_version" != "$version" ]]; then
              echo "Tag $tag does not match package.json version $package_version" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Download verified standalone executables
        uses: actions/download-artifact@v4
        with:
          name: standalone
          path: artifacts

      - name: Pack
        run: |
          npm pack
          sha256sum "adrifer-winix-${{ steps.release.outputs.version }}.tgz" > "adrifer-winix-${{ steps.release.outputs.version }}.tgz.sha256"

      - name: Publish to npm
        run: npm publish "./adrifer-winix-${{ steps.release.outputs.version }}.tgz" --access public --tag "${{ steps.release.outputs.npm_tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
          elif [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

          (cd scripts && sha256sum bootstrap-windows.ps1 > bootstrap-windows.ps1.sha256)
          (cd scripts && sha256sum bootstrap-nixos.sh > bootstrap-nixos.sh.sha256)
          (cd scripts && sha256sum bootstrap-linux.sh > bootstrap-linux.sh.sha256)
          gh release upload "$GITHUB_REF_NAME" \
            "adrifer-winix-${{ steps.release.outputs.version }}.tgz" \
            "adrifer-winix-${{ steps.release.outputs.version }}.tgz.sha256" \
            scripts/bootstrap-windows.ps1 \
            scripts/bootstrap-windows.ps1.sha256 \
            scripts/bootstrap-nixos.sh \
            scripts/bootstrap-nixos.sh.sha256 \
            scripts/bootstrap-linux.sh \
            scripts/bootstrap-linux.sh.sha256 \
            artifacts/winix-windows-x64.exe \
            artifacts/winix-windows-arm64.exe \
            artifacts/winix-linux-x64 \
            artifacts/winix-linux-arm64 \
            artifacts/SHA256SUMS \
            artifacts/LICENSE \
            artifacts/NOTICE.txt \
            artifacts/BUN-LICENSE.md \
            --clobber
